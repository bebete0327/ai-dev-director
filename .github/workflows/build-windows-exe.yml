name: Build Windows Standalone EXE

on:
  push:
    branches:
      - main
      - "feat/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build and smoke-test AI-Dev-Director.exe
        shell: pwsh
        run: .\build-exe.ps1

      - name: Upload Windows Standalone ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Dev-Director-win64
          path: |
            dist/AI-Dev-Director-win64/AI-Dev-Director.exe
            dist/AI-Dev-Director-win64/config.yaml
            dist/AI-Dev-Director-win64/companion.json
          retention-days: 90

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI-Dev-Director-win64.zip
          generate_release_notes: true
